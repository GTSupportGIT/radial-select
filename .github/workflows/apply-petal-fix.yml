name: Apply petal fix

on:
  push:
    branches:
      - fix/true-straight-sided-petals

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/true-straight-sided-petals
      - name: Replace petal geometry
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [Path('src/radial-select.js'), Path('dist/radial-select.js')]
          old_path = 'const PETAL_PATH = "M38 132 L38 116 L15 64 Q14 61 14 57 L14 42 C14 20 31 5 54 5 C77 5 94 20 94 42 L94 57 Q94 61 93 64 L70 116 L70 132 Z";'
          new_path = 'const PETAL_PATH = "M39 132 L12 50 A42 42 0 0 1 96 50 L69 132 Z";'
          old_mini = 'clip-path:path("M8 34 L8 30 L2.5 16 Q2 15 2 14 L2 10 C2 4.5 6 1 11.5 1 C17 1 21 4.5 21 10 L21 14 Q21 15 20.5 16 L15 30 L15 34 Z")'
          new_mini = 'clip-path:path("M8.5 34 L1.5 13 A10 10 0 0 1 21.5 13 L14.5 34 Z")'
          for p in files:
              text = p.read_text()
              if old_path not in text or old_mini not in text:
                  raise SystemExit(f'Expected geometry not found in {p}')
              text = text.replace(old_path, new_path).replace(old_mini, new_mini)
              p.write_text(text)
          PY
      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          git rm .github/workflows/apply-petal-fix.yml
          git config user.name "GTSupportGIT"
          git config user.email "mail@gtsupport.co.uk"
          git add src/radial-select.js dist/radial-select.js
          git commit -m "Use true straight-sided petal geometry"
          git push origin HEAD:fix/true-straight-sided-petals
